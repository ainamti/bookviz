<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookviz — logo showcase</title>
<link rel="stylesheet" href="logo-showcase.css">
</head>
<body>

<div class="gradient-stage" id="gradient-stage">
  <div class="noise-layer"></div>

  <div class="logo-showcase">
    <!-- Full horizontal wordmark logo -->
    <div class="logo-card">
      <svg viewBox="0 0 268 80" width="268" height="80" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz" role="img">
        <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />
        <rect x="13" y="50" width="54" height="10" rx="3" fill="hsl(193, 55%, 78%)" opacity="0.85" />
        <rect x="17" y="38" width="46" height="10" rx="3" fill="hsl(224, 50%, 80%)" opacity="0.92" />
        <rect x="21" y="26" width="38" height="10" rx="3" fill="hsl(255, 48%, 81%)" />
        <path d="M 46,10 L 54,10 L 54,26 L 50,21 L 46,26 Z" fill="hsl(255, 48%, 81%)" opacity="0.9" />
        <text x="98" y="40" dominant-baseline="middle" font-family="'DM Sans', sans-serif" font-weight="300" font-size="29" letter-spacing="-0.5">
          <tspan fill="rgba(255,255,255,0.92)">book</tspan><tspan fill="#7DD3C8">viz</tspan>
        </text>
      </svg>
    </div>

    <!-- Icon-only mark (favicons, avatars, etc.) -->
    <div class="logo-variants">
      <div class="variant-label">Icon mark</div>
      <div class="variant-row">
        <svg viewBox="0 0 80 80" width="64" height="64" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz icon">
          <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />
          <rect x="13" y="50" width="54" height="10" rx="3" fill="hsl(193, 55%, 78%)" opacity="0.85" />
          <rect x="17" y="38" width="46" height="10" rx="3" fill="hsl(224, 50%, 80%)" opacity="0.92" />
          <rect x="21" y="26" width="38" height="10" rx="3" fill="hsl(255, 48%, 81%)" />
          <path d="M 46,10 L 54,10 L 54,26 L 50,21 L 46,26 Z" fill="hsl(255, 48%, 81%)" opacity="0.9" />
        </svg>

        <svg viewBox="0 0 80 80" width="40" height="40" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz icon small">
          <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />
          <rect x="13" y="50" width="54" height="10" rx="3" fill="hsl(193, 55%, 78%)" opacity="0.85" />
          <rect x="17" y="38" width="46" height="10" rx="3" fill="hsl(224, 50%, 80%)" opacity="0.92" />
          <rect x="21" y="26" width="38" height="10" rx="3" fill="hsl(255, 48%, 81%)" />
          <path d="M 46,10 L 54,10 L 54,26 L 50,21 L 46,26 Z" fill="hsl(255, 48%, 81%)" opacity="0.9" />
        </svg>

        <svg viewBox="0 0 80 80" width="24" height="24" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz favicon">
          <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />
          <rect x="13" y="50" width="54" height="10" rx="3" fill="hsl(193, 55%, 78%)" opacity="0.85" />
          <rect x="17" y="38" width="46" height="10" rx="3" fill="hsl(224, 50%, 80%)" opacity="0.92" />
          <rect x="21" y="26" width="38" height="10" rx="3" fill="hsl(255, 48%, 81%)" />
          <path d="M 46,10 L 54,10 L 54,26 L 50,21 L 46,26 Z" fill="hsl(255, 48%, 81%)" opacity="0.9" />
        </svg>
      </div>

      <!-- Light background variant -->
      <div class="variant-label" style="margin-top:1.5rem;">On light</div>
      <div class="variant-row light-bg">
        <svg viewBox="0 0 268 80" width="220" height="65" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz light variant">
          <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />
          <rect x="13" y="50" width="54" height="10" rx="3" fill="hsl(193, 55%, 78%)" opacity="0.85" />
          <rect x="17" y="38" width="46" height="10" rx="3" fill="hsl(224, 50%, 80%)" opacity="0.92" />
          <rect x="21" y="26" width="38" height="10" rx="3" fill="hsl(255, 48%, 81%)" />
          <path d="M 46,10 L 54,10 L 54,26 L 50,21 L 46,26 Z" fill="hsl(255, 48%, 81%)" opacity="0.9" />
          <text x="98" y="40" dominant-baseline="middle" font-family="'DM Sans', sans-serif" font-weight="300" font-size="29" letter-spacing="-0.5">
            <tspan fill="#111827">book</tspan><tspan fill="#0D9488">viz</tspan>
          </text>
        </svg>
      </div>
    </div>
  </div>
</div>

<script src="logo-showcase.js"></script>
</body>
</html>
