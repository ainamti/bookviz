<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookviz — logo showcase</title>
<link rel="stylesheet" href="logo-showcase.css">
</head>
<body>

<div class="gradient-stage" id="gradient-stage">
  <div class="noise-layer"></div>

  <div class="logo-showcase">
    <!-- Full horizontal wordmark logo -->
    <div class="logo-card">
      <svg viewBox="0 0 268 80" width="268" height="80" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz" role="img">
        <style>
          .bv-line-0 { animation: bv-shimmer 5s ease-in-out 0.00s infinite; }
          .bv-line-1 { animation: bv-shimmer 5s ease-in-out 0.22s infinite; }
          .bv-line-2 { animation: bv-shimmer 5s ease-in-out 0.44s infinite; }
          .bv-line-3 { animation: bv-shimmer 5s ease-in-out 0.66s infinite; }
          .bv-line-4 { animation: bv-shimmer 5s ease-in-out 0.88s infinite; }
          .bv-line-5 { animation: bv-shimmer 5s ease-in-out 1.10s infinite; }
          .bv-line-6 { animation: bv-shimmer 5s ease-in-out 1.32s infinite; }
          .bv-line-7 { animation: bv-shimmer 5s ease-in-out 1.54s infinite; }
          .bv-line-8 { animation: bv-shimmer 5s ease-in-out 1.76s infinite; }
          @keyframes bv-shimmer { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
        </style>

        <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />

        <path class="bv-line-0" d="M 13,62 Q 40,61 67,62" stroke="hsl(172, 55%, 74%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-1" d="M 13,57 Q 40,54.5 67,57" stroke="hsl(182, 55%, 74%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-2" d="M 13,52 Q 40,48 67,52" stroke="hsl(193, 55%, 75%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-3" d="M 13,47 Q 40,42 67,47" stroke="hsl(203, 52%, 76%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-4" d="M 13,42 Q 40,36 67,42" stroke="hsl(214, 50%, 77%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-5" d="M 13,37 Q 40,30 67,37" stroke="hsl(224, 48%, 77%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-6" d="M 13,32 Q 40,24 67,32" stroke="hsl(234, 46%, 78%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-7" d="M 13,27 Q 40,18.5 67,27" stroke="hsl(245, 45%, 78%)" stroke-width="1.6" stroke-linecap="round" fill="none" />
        <path class="bv-line-8" d="M 13,22 Q 40,13 67,22" stroke="hsl(255, 45%, 79%)" stroke-width="1.6" stroke-linecap="round" fill="none" />

        <text x="98" y="40" dominant-baseline="middle" font-family="'DM Sans', sans-serif" font-weight="300" font-size="29" letter-spacing="-0.5">
          <tspan fill="rgba(255,255,255,0.92)">book</tspan><tspan fill="#7DD3C8">viz</tspan>
        </text>
      </svg>
    </div>

          <path d="M 13,22 Q 40,13 67,22" stroke="hsl(255, 45%, 79%)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.95" />
        </svg>
      </div>

      <!-- Light background variant -->
      <div class="variant-label" style="margin-top:1.5rem;">On light</div>
      <div class="variant-row light-bg">
        <svg viewBox="0 0 268 80" width="220" height="65" xmlns="http://www.w3.org/2000/svg" aria-label="Bookviz light variant">
          <rect x="0" y="0" width="80" height="80" rx="17" fill="#111827" />
